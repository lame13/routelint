name: Bug report
description: Report incorrect output, a crash, or an unsupported response shape.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual result. Remove private URLs, cookies, and tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RouteLint version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.12.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Command
      options: [check, next, diff, programmatic API]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a public fixture or a small local server.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      render: shell
