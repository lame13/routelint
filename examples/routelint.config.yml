baseUrl: https://example.com
seeds:
  - /
urls: []
sitemaps: auto
agents:
  - googlebot
respectRobots: true
queryPolicy: drop

redirects:
  - from: /old-pricing
    to: /pricing
    status: 301
    maxHops: 1
  # A pattern contract is verified against the matching URLs the crawl observes.
  - from: /blog/old/*
    to: /blog/new/*
    status: 308
    maxHops: 2
    samples:
      - /blog/old/hello-world
  # Destinations may leave the audited origin.
  - from: /moved-away
    to: https://archive.example.com/moved-away
    status: 308

exclude:
  - /account/**
  - /api/**

limits:
  maxPages: 250
  maxDepth: 8
  concurrency: 6
  timeoutMs: 15000
  maxBytes: 2000000
  maxRedirects: 5
  delayMs: 0
  honorCrawlDelay: true

audit:
  requireTitle: true
  requireDescription: true
  requireCanonical: true
  requireH1: true
  requireSitemapCoverage: true
  maxDepth: 4
  maxResponseMs: 1000
  maxRedirectHopMs: 500
  severities: {}
  paths: []

rendered:
  enabled: false
  concurrency: 2
  timeoutMs: 20000
  settleMs: 250

# Remove this block outside a Next.js project.
next:
  root: .
  buildDirectory: .next
  samples:
    /blog/[slug]:
      - /blog/hello-world
