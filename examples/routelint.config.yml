baseUrl: https://example.com
seeds:
  - /
sitemaps: auto
agents:
  - googlebot
respectRobots: true
queryPolicy: drop

exclude:
  - /account/**
  - /api/**

limits:
  maxPages: 250
  maxDepth: 8
  concurrency: 6
  timeoutMs: 15000
  maxBytes: 2000000
  maxRedirects: 5

audit:
  requireTitle: true
  requireDescription: true
  requireCanonical: true
  requireH1: true
  requireSitemapCoverage: true
  maxDepth: 4

# Remove this block outside a Next.js project.
next:
  root: .
  buildDirectory: .next
  samples:
    /blog/[slug]:
      - /blog/hello-world
